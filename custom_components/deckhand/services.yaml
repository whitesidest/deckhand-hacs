push_theme:
  name: Push Theme
  description: Push a theme to one or more Deckhand dials.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to push the theme to. You can pick several dials, a Room, or type the special id "all" (YAML mode) to target every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    theme:
      name: Theme
      description: >
        Theme slug to push. Built-in slugs match the Helm seed (e.g.
        ``elysian``, ``concierge``, ``nordic``, ``vault``, ``atelier``).
        Custom slugs created in Helm or Console work too — firmware
        validates the slug, and a slug it doesn't recognise is silently
        ignored. The Theme **entity** in HA (one per dial) shows the
        team's live theme catalog pulled from the retained
        ``themes/list`` MQTT topic, so use that for picking by name.
      required: true
      example: "elysian"
      selector:
        text:
    theme_options:
      name: Theme options
      description: >
        Per-theme custom options for themes that accept them. Wedding
        accepts ``diamond_count`` (0/1/2), ``initials`` (up to 3
        characters), and ``flower_color`` (classic, blush, champagne,
        lavender, white_orchid). Other themes have their own schemas
        — open the theme in Helm's Gallery to see the available
        options. Keys the dial doesn't recognise are silently ignored,
        so it's safe to pre-stage options for upcoming themes.
        Transient — for persistence across reboot, save the options
        in the Helm UI instead.
      example: |
        diamond_count: 2
        initials: "TM"
        flower_color: blush
      selector:
        object:

send_announcement:
  name: Send Announcement
  description: Send an announcement message to a Deckhand dial.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to send the announcement to. You can pick several dials, a Room, or type the special id "all" (YAML mode) to target every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    message:
      name: Message
      description: The announcement message to display.
      required: true
      example: "Dinner is ready!"
      selector:
        text:
    from_name:
      name: From
      description: Who the announcement is from.
      default: "Home Assistant"
      selector:
        text:
    duration:
      name: Duration
      description: How long to display the announcement (seconds).
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds
    animation:
      name: Animation
      description: >
        Visual effect to play behind the announcement. Aesthetic keys
        (sparkle, snow, …) inherit the dial's theme accent. Semantic
        keys (signal:*) carry meaning — color and haptic are theme-
        invariant. signal:emergency adds a haptic pulse.
      default: "none"
      selector:
        select:
          options:
            - "none"
            - sparkle
            - flash
            - fireworks
            - magic_spell
            - fire
            - waves
            - rain
            - opening_flower
            - falling_leaves
            - confetti
            - snow
            - aurora
            - ripple
            - "signal:ready"
            - "signal:question"
            - "signal:available"
            - "signal:timed_state"
            - "signal:overdue"
            - "signal:comfort"
            - "signal:priority"
            - "signal:emergency"
            - "signal:dnd"
    snapshot_entity:
      name: Camera snapshot
      description: >
        Optional camera entity to snapshot and display as the
        announcement backdrop — the natural doorbell path. HACS fetches
        the frame over the LAN, converts it to RGB565, and streams it to
        the dial directly over MQTT (it does not route through Helm). The
        dial suppresses its theme animation while the image arrives. If
        the snapshot can't be fetched, the text announcement is still
        sent. Takes precedence over ``image_url`` if both are set.

        Images render at 360x360 (the universal size that displays on
        every dial; AMOLED dials upscale) since HACS doesn't track each
        dial's hardware type.
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    image_url:
      name: Image URL
      description: >
        Optional image URL to fetch and display as the announcement
        backdrop. Fetched via HA's shared HTTP session, converted to
        RGB565, and streamed to the dial over MQTT. Must return an
        ``image/*`` content type. Ignored if ``snapshot_entity`` is set.
        On fetch failure the text announcement is still sent.
      example: "http://192.168.1.50/snapshot.jpg"
      selector:
        text:

send_countdown:
  name: Send Countdown
  description: >
    Schedule a countdown announcement on a Deckhand dial. The dial shows
    a live counter ticking down to the target moment, then transitions
    to a celebration message + animation at T=0. Optionally swaps to a
    celebration theme at the same moment.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    target_datetime:
      name: Target Moment
      description: When the countdown reaches zero (the celebration moment).
      required: true
      example: "2026-12-31T23:59:59"
      selector:
        datetime:
    message:
      name: Countdown Message
      description: Text shown small below the live counter during the countdown.
      example: "Almost there..."
      selector:
        text:
    celebration_message:
      name: Celebration Message
      description: Text shown when the countdown hits zero.
      required: true
      example: "Happy New Year!"
      selector:
        text:
    celebration_animation:
      name: Celebration Animation
      description: Visual effect that fires at T=0.
      default: "fireworks"
      selector:
        select:
          options:
            - "none"
            - sparkle
            - flash
            - fireworks
            - magic_spell
            - fire
            - waves
            - rain
            - opening_flower
            - falling_leaves
            - confetti
            - snow
            - aurora
            - ripple
    celebration_theme:
      name: Celebration Theme
      description: >
        Optional theme slug to push at T=0. Leave blank to keep the
        dial's current theme. Firmware validates the slug — unknown
        slugs are silently ignored. Use the Theme entity (one per dial)
        to discover what's currently in your team's catalog.
      example: "royale"
      selector:
        text:
    lead_seconds:
      name: Lead Time (seconds)
      description: How long before the target the countdown should start.
      default: 60
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: seconds
    from_name:
      name: From
      description: Who the countdown is from.
      default: "Home Assistant"
      selector:
        text:

reboot:
  name: Reboot
  description: Reboot a Deckhand dial.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to reboot. You can pick several dials, a Room, or type the special id "all" (YAML mode) to target every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true

set_timezone:
  name: Set Timezone
  description: >
    Set the per-dial timezone. Accepts an IANA name (e.g.
    "America/Los_Angeles") which is converted to a POSIX TZ string
    before being published over MQTT — the firmware passes that string
    straight to setenv("TZ", ...) so the clock face and any time
    rendering immediately reflect the new zone. Schedules continue to
    fire correctly because the wire format is epoch.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to retime.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    timezone:
      name: IANA Timezone
      description: IANA name like "America/New_York" or "Europe/Paris".
      required: true
      example: "America/New_York"
      selector:
        select:
          options:
            - "UTC"
            - "America/Los_Angeles"
            - "America/Vancouver"
            - "America/Denver"
            - "America/Phoenix"
            - "America/Chicago"
            - "America/Mexico_City"
            - "America/New_York"
            - "America/Toronto"
            - "America/Anchorage"
            - "America/Sao_Paulo"
            - "Pacific/Honolulu"
            - "Europe/London"
            - "Europe/Paris"
            - "Europe/Berlin"
            - "Europe/Madrid"
            - "Europe/Rome"
            - "Europe/Amsterdam"
            - "Europe/Stockholm"
            - "Europe/Athens"
            - "Africa/Cairo"
            - "Africa/Johannesburg"
            - "Asia/Dubai"
            - "Asia/Kolkata"
            - "Asia/Singapore"
            - "Asia/Hong_Kong"
            - "Asia/Shanghai"
            - "Asia/Seoul"
            - "Asia/Tokyo"
            - "Australia/Perth"
            - "Australia/Brisbane"
            - "Australia/Sydney"
            - "Australia/Melbourne"
            - "Pacific/Auckland"

apply_overlay:
  name: Apply Overlay
  description: >
    Apply a transient runtime overlay to a dial without replacing the
    saved theme or face. Use for reactive automations — "flash a sensor
    quadrant face when air quality spikes", "bump brightness on motion",
    "show a subtitle alert for 10 minutes". Distinct from
    ``mount_face``: that one writes RETAINED face state that survives
    reboot. ``apply_overlay`` is ephemeral by default; set ``ttl_s`` for
    an auto-revert timer. Any field left unset keeps the dial's current
    value.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    subtitle_mode:
      name: Subtitle mode
      description: >
        How the dial picks the subtitle source. ``theme`` follows the
        theme default, ``custom`` shows the ``subtitle_text`` you provide,
        ``date`` / ``date_year`` show the calendar date,
        ``ical_next_event`` shows your next upcoming calendar event
        (materialized server-side from your configured iCal/Google
        Calendar feeds), ``none`` hides the subtitle entirely.
      example: "custom"
      selector:
        select:
          options:
            - "theme"
            - "custom"
            - "date"
            - "date_year"
            - "ical_next_event"
            - "none"
    subtitle_text:
      name: Subtitle text
      description: >
        Transient subtitle flash under the clock. Use for short-lived
        notifications. Supplying text without picking a mode auto-flips
        the dial into ``custom`` so the text is actually shown; passing
        text together with a mode other than ``custom`` (e.g. ``date``)
        also auto-flips to ``custom`` so the typed text wins.

        Caveat: subtitle lives in the clock face's own mount payload on
        the firmware side, so this override is **best-effort and
        short-lived** — the next clock face mount (push from Helm,
        reboot, etc.) clobbers it. For a subtitle that must persist,
        send a clock face mount with the subtitle baked into the
        payload instead of using apply_overlay.
      example: "Lightning detected"
      selector:
        text:
    home_face:
      name: Home Face
      description: >
        Which face the dial home screen renders. ``clock`` is the
        default; ``sensor`` enables the 1-4 quadrant readouts (see the
        sensor_* fields below); ``message`` shows a big centered string
        (see ``home_message``); ``framecast`` / ``volume`` / ``blank`` /
        ``image`` are their dedicated faces. Persistent face
        state should be set via ``mount_face``; this is the
        transient-flash variant.
      example: "sensor"
      selector:
        select:
          options:
            - "theme"
            - "clock"
            - "message"
            - "sensor"
            - "image"
            - "blank"
            - "volume"
            - "framecast"
    home_message:
      name: Home Message
      description: Large message shown when ``home_face`` is ``message``.
      example: "Storm warning"
      selector:
        text:
    sensor_entity_id:
      name: Sensor entity ID (slot 1)
      description: >
        HA entity to display when ``home_face`` is ``sensor``. The
        integration publishes the entity's current value immediately and
        keeps it in sync as it changes.
      example: "sensor.living_room_temperature"
      selector:
        entity:
    sensor_label:
      name: Sensor label (slot 1)
      description: Display label for the slot-1 sensor.
      example: "Living"
      selector:
        text:
    sensor_quad_2_entity_id:
      name: Quad slot 2 entity
      description: HA entity for the second quadrant of the sensor face.
      selector:
        entity:
    sensor_quad_2_label:
      name: Quad slot 2 label
      selector:
        text:
    sensor_quad_3_entity_id:
      name: Quad slot 3 entity
      description: HA entity for the third quadrant of the sensor face.
      selector:
        entity:
    sensor_quad_3_label:
      name: Quad slot 3 label
      selector:
        text:
    sensor_quad_4_entity_id:
      name: Quad slot 4 entity
      description: HA entity for the fourth quadrant of the sensor face.
      selector:
        entity:
    sensor_quad_4_label:
      name: Quad slot 4 label
      selector:
        text:
    sensor_marquee:
      name: Marquee entities
      description: >
        Up to 12 sensors that scroll across the dial as a marquee.
        Pass a YAML list of either bare entity ids
        (``- sensor.outdoor_temp``) or per-entry objects
        (``- entity_id: sensor.x`` / ``label: "..."`` / ``unit: "F"``).
      example: |
        - sensor.outdoor_temp
        - entity_id: sensor.living_humidity
          label: Humidity
        - entity_id: sensor.battery_pct
          label: Battery
          unit: "%"
      selector:
        object:
    marquee_position:
      name: Marquee position
      description: Where the scrolling marquee renders on the dial face.
      default: subtitle
      selector:
        select:
          options:
            - subtitle
            - ring
    framecast_frame_id:
      name: FrameCast frame ID
      description: >
        Configured Samsung Frame TV UUID. Empty = "auto pick the only
        Frame", which the server resolves before pushing cmd/framecast.
      example: ""
      selector:
        text:
    brightness:
      name: Brightness
      description: Display brightness override (0-100).
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    hide_label:
      name: Hide Label
      description: >
        When true, the dial stops rendering its label above the clock.
        One-shot — survives until the next overlay or reboot. To make
        the change persistent, save the dial-level "Hide Label" setting
        in Helm or Console.
      selector:
        boolean:
    ttl_s:
      name: TTL (seconds)
      description: >
        If set, the firmware reverts to the last full theme after this
        many seconds. Omit or set to 0 for a sticky overlay.
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: seconds

update_now_playing:
  name: Update Now Playing
  description: >
    Stream a now-playing update to a dial's home face. Lightweight,
    high-frequency — fire on track change, not on every progress tick.
    Leave title blank to revert the dial to its theme-default home face.
    Ephemeral — not persisted across reboot.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    title:
      name: Track title
      description: Blank reverts the dial to its theme-default home face.
      example: "Dreams"
      selector:
        text:
    artist:
      name: Artist
      example: "Fleetwood Mac"
      selector:
        text:
    album_art_url:
      name: Album art URL
      description: Optional — the dial will attempt to fetch and display.
      selector:
        text:
    source:
      name: Source label
      description: e.g. "Spotify", "Sonos", "AirPlay".
      example: "Spotify"
      selector:
        text:
    is_playing:
      name: Is playing
      description: When false, the face stays visible but dimmed.
      default: true
      selector:
        boolean:
    entity_id:
      name: Source entity (optional)
      description: >
        HA media_player entity id this update represents. When set, a
        play/pause click on the dial controls THIS entity. When omitted,
        the dial falls back to the room's default media_player binding.
      example: "media_player.jellyfin_galaxy_tab"
      selector:
        entity:
          domain: media_player

update_from_media_player:
  name: Update From Media Player
  description: >
    Read the current state of a media_player entity and stream it to a
    Deckhand dial's now-playing face. Handles title, artist (or series
    title for video), album art / poster, source, and playback state.
    For always-on auto-push, configure a binding in the integration's
    options instead of calling this service manually.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    entity_id:
      name: Media Player
      description: The media_player entity to mirror.
      required: true
      example: "media_player.living_room_tv"
      selector:
        entity:
          domain: media_player

update_sensor_value:
  name: Update Sensor Value
  description: >
    Stream a sensor value update to a dial. Refreshes the sensor home face
    in place when visible, otherwise buffered. Ephemeral.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    entity_id:
      name: Source entity
      description: HA entity id this reading belongs to.
      required: true
      example: "sensor.living_room_temp"
      selector:
        entity:
    label:
      name: Label
      description: Short label shown above the value.
      example: "Living Room"
      selector:
        text:
    value:
      name: Value
      description: String or number. Rendered verbatim on the dial.
      required: true
      example: "72"
      selector:
        text:
    unit:
      name: Unit
      example: "°F"
      selector:
        text:
    icon:
      name: Icon
      description: Optional FontAwesome-style glyph id for future use.
      example: "fa-thermometer-half"
      selector:
        text:
    color:
      name: Tint color
      description: Hex string like "#FFD700" to tint the value display.
      example: "#FFD700"
      selector:
        text:

# ── Phase 6 dial-platform — face dispatch services ──────────────────────
# Faces are functional UI layers (Perimeter Pulse, future room-aware
# faces). Themes are atmosphere; faces are function. A face is mounted
# onto a dial and either takes over the screen entirely
# (FACE_OWNS_SCREEN) or paints a thin overlay on top of the active
# theme (default — Perimeter Pulse uses this mode).

mount_perimeter_pulse:
  name: Mount Perimeter Pulse
  description: >
    Mount the Perimeter Pulse face on a dial. The bar wraps the rim of
    the round display, with each binding owning an angular segment
    rendered via a treatment (state_color / ripple / gradient / flash /
    sweep). Retained — the dial re-mounts the same face on reboot.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial to mount the face on.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    bindings:
      name: Bindings
      description: >
        Array of { id, friendly_name, angular_center, angular_width,
        treatment, state, active_state, base_color, active_color, value,
        opacity }. See documentation. Treatments: state_color (locks /
        doors), ripple (motion / doorbell), gradient (continuous value),
        flash (alarms), sweep (ambient zone).
      required: true
      example: |
        - id: front_door
          friendly_name: Front Door
          angular_center: 0
          angular_width: 24
          treatment: state_color
          active_state: unlocked
          base_color: "#68C8D8"
          active_color: "#E89858"
        - id: living_motion
          friendly_name: Living Room
          angular_center: 90
          angular_width: 30
          treatment: ripple
          active_state: "on"
          base_color: "#3A4A5A"
          active_color: "#9AC8E8"
      selector:
        object:
    contiguous:
      name: Contiguous Ring
      description: >
        When true, bindings sort by angular_center and each segment
        extends to the midpoint with its neighbors — the whole rim is
        owned. When false (default), each segment uses its own
        angular_width with empty space in between.
      default: false
      selector:
        boolean:
    bar_thickness:
      name: Bar Thickness
      description: Bar width in pixels. Default 7. Range 1-40.
      default: 7
      selector:
        number:
          min: 1
          max: 40
          unit_of_measurement: px
    bar_opacity:
      name: Bar Opacity
      description: >
        Face-level opacity 0-1. 1 = clear-as-day (default), lower values
        let the theme breathe through. Per-binding opacity overrides if
        set on a binding.
      default: 0.94
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    subtitle_text:
      name: Subtitle
      description: >
        Optional text rendered under the perimeter when no binding is
        active. Leave blank if you don't want a calm-state caption — the
        dial hides the line entirely when this field is empty.
      selector:
        text:

update_perimeter_state:
  name: Update Perimeter State
  description: >
    Push state for one or more Perimeter Pulse bindings. Use this from
    HA automations: when a lock unlocks, when a motion sensor trips,
    when a temperature changes. Set "event: true" to trigger ripple /
    flash animation for that frame.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    states:
      name: Bindings to update
      description: >
        Array of state updates. Each entry is { id, state, value, event }.
        At minimum supply id and either state or value. Set event=true to
        fire a ripple/flash pulse on the binding.
      required: true
      example: |
        - id: front_door
          state: unlocked
        - id: living_motion
          state: "on"
          event: true
        - id: living_temp
          value: 0.62
      selector:
        object:

mount_face:
  name: Mount Face (Generic)
  description: >
    Generic escape hatch — mount any registered face by id with a free-
    form payload dict. Used for forward compatibility with faces the
    HACS integration doesn't know about yet.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    face_id:
      name: Face ID
      description: Face identifier registered in firmware.
      required: true
      example: "perimeter_pulse"
      selector:
        text:
    payload:
      name: Payload
      description: Free-form dict — passed through to the face's on_mount.
      required: true
      example: |
        subtitle_text: "Ready"
        bindings: []
      selector:
        object:
    retained:
      name: Retain
      description: When true, retained on the broker so the face survives reboot.
      default: true
      selector:
        boolean:

unmount_face:
  name: Unmount Face
  description: >
    Dismiss the active face and return the dial to its theme's clock.
    Also clears the retained mount so a broker reconnect doesn't
    resurrect the dismissed face. Pair with mount_face for reactive
    faces (e.g. the Charge face when an EV session ends).
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    face_id:
      name: Face ID
      description: Face identifier to unmount (matches the mount).
      required: true
      example: "charge"
      selector:
        text:

send_invitation:
  name: Send Invitation
  description: >
    Send a touch-and-hold consent prompt to a Deckhand dial. The dial
    queues internally (FIFO, cap 5) and waits to display until the
    clock face is idle — it never interrupts an in-progress
    interaction. The guest accepts by touching and holding the
    screen; declines by spinning the encoder. To run an automation on
    accept or decline, listen for a ``deckhand_dial_event`` with
    ``type: invitation_response`` and match on the ``invitation_id``
    you supplied here (auto-generated if omitted, returned in the log
    line).
  fields:
    device_id:
      name: Device
      description: The Deckhand dial to invite.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    text:
      name: Prompt
      description: The question or invitation shown on the dial.
      required: true
      example: "Stewards: open the bar?"
      selector:
        text:
    subtitle:
      name: Subtitle
      description: Smaller line under the prompt. Optional.
      example: "Hold the screen to confirm"
      selector:
        text:
    invitation_id:
      name: Invitation ID
      description: >
        Optional id echoed back in the response event. If you want one
        automation to react to a specific invitation, set this so you
        can match in the trigger. Auto-generated if omitted.
      example: "invite-bar-open-1"
      selector:
        text:
    accept_label:
      name: Accept label
      description: Instruction under the perimeter ring during the hold.
      default: "Hold to accept"
      selector:
        text:
    decline_label:
      name: Decline label
      description: Instruction shown for the spin-to-decline gesture.
      default: "Spin to decline"
      selector:
        text:
    hold_seconds:
      name: Hold time
      description: How long the guest must touch-and-hold to accept.
      default: 5
      selector:
        number:
          min: 2
          max: 15
          unit_of_measurement: seconds
    ttl_s:
      name: TTL (seconds)
      description: >
        Wall-clock window before the invitation auto-expires. The dial
        emits an ``invitation_response`` with ``response: "expired"`` if
        no one resolves it in time.
      default: 600
      selector:
        number:
          min: 10
          max: 86400
          unit_of_measurement: seconds
    priority:
      name: Priority
      description: >
        ``urgent`` jumps ahead of normal-priority items in the queue.
        Use sparingly — the dial still waits for idle before displaying.
      default: normal
      selector:
        select:
          options:
            - normal
            - urgent
    theme_override:
      name: Theme override slug
      description: >
        Optional theme slug to render behind the prompt card. Falls back
        to the dial's current theme. ``solid_color`` is ignored when
        ``theme_override`` is set.
      example: "concierge"
      selector:
        text:
    solid_color:
      name: Solid background color
      description: 'Hex like "#0A1F2C" — used when no theme_override.'
      example: "#0A1F2C"
      selector:
        text:
    from_name:
      name: From
      description: Who the invitation is from. Optional.
      example: "Home Assistant"
      selector:
        text:
    on_accept:
      name: On-accept payload
      description: >
        Optional opaque JSON object echoed by the dial when accepted.
        For pure-HA flows you can omit this — listen for the
        ``invitation_response`` event with ``response: "accepted"`` and
        branch in the automation. Provide this only when Helm (or
        another consumer of the response event) should route the
        action server-side. Shape:
        ``{ type: "fire_ha_service" | "push_theme" | ..., data: {...} }``.
      selector:
        object:

cancel_invitation:
  name: Cancel Invitation
  description: >
    Retract a pending or displayed invitation by id. If the dial was
    showing it, the dial emits an ``invitation_response`` with
    ``response: "cancelled"``.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial that holds the invitation.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    invitation_id:
      name: Invitation ID
      description: The same id supplied to ``send_invitation``.
      required: true
      example: "invite-bar-open-1"
      selector:
        text:
