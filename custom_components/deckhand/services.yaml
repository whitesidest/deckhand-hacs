push_theme:
  name: Push Theme
  description: Push a theme to one or more Deckhand dials.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to push the theme to. You can pick several dials, a Room, or type the special id "all" (YAML mode) to target every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    theme:
      name: Theme
      description: >
        Theme slug to push. Built-in slugs match the Helm seed (e.g.
        ``elysian``, ``concierge``, ``nordic``, ``vault``, ``atelier``).
        Custom slugs created in Helm or Console work too — firmware
        validates the slug, and a slug it doesn't recognise is silently
        ignored. The Theme **entity** in HA (one per dial) shows the
        team's live theme catalog pulled from the retained
        ``themes/list`` MQTT topic, so use that for picking by name.
        Special value ``random`` lets the server pick a random activated
        theme for each dial (excluding its current one) — a new look
        every time.
      required: true
      example: "elysian"
      selector:
        text:
    theme_options:
      name: Theme options
      description: >
        Per-theme custom options for themes that accept them. Wedding
        accepts ``diamond_count`` (0/1/2), ``initials`` (up to 3
        characters), and ``flower_color`` (classic, blush, champagne,
        lavender, white_orchid). Other themes have their own schemas
        — open the theme in Helm's Gallery to see the available
        options. Keys the dial doesn't recognise are silently ignored,
        so it's safe to pre-stage options for upcoming themes.
        Transient — for persistence across reboot, save the options
        in the Helm UI instead.
      example: |
        diamond_count: 2
        initials: "TM"
        flower_color: blush
      selector:
        object:

send_announcement:
  name: Send Announcement
  description: Send an announcement message to a Deckhand dial.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to send the announcement to. You can pick several dials, a Room, or type the special id "all" (YAML mode) to target every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    message:
      name: Message
      description: The announcement message to display.
      required: true
      example: "Dinner is ready!"
      selector:
        text:
    from_name:
      name: From
      description: Who the announcement is from.
      default: "Home Assistant"
      selector:
        text:
    duration:
      name: Duration
      description: >-
        How long to show it, in seconds. Leave empty to keep it on the dial
        until someone touches it — right for alerts nobody should miss.
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds
    animation:
      name: Animation
      description: >
        Visual effect to play behind the announcement. Aesthetic keys
        (sparkle, snow, …) inherit the dial's theme accent. Semantic
        keys (signal:*) carry meaning — color and haptic are theme-
        invariant. signal:emergency adds a haptic pulse.
      default: "none"
      selector:
        select:
          options:
            - "none"
            - sparkle
            - flash
            - fireworks
            - magic_spell
            - fire
            - waves
            - rain
            - opening_flower
            - falling_leaves
            - confetti
            - snow
            - aurora
            - ripple
            - "signal:ready"
            - "signal:question"
            - "signal:available"
            - "signal:timed_state"
            - "signal:overdue"
            - "signal:comfort"
            - "signal:priority"
            - "signal:emergency"
            - "signal:dnd"
    transition:
      name: Arrival
      description: >
        How the announcement ARRIVES on screen. ``fade`` is the default
        and is the standard easing every announcement has always used —
        leaving it alone changes nothing. ``none`` appears instantly.
        ``iris`` closes a circle over the screen and opens it on the
        announcement; ``dissolve`` does the same with a soft fade. Save
        the curtains for moments that deserve them: on routine traffic
        they make a room feel busier, not calmer.
      default: "fade"
      selector:
        select:
          options:
            - "fade"
            - "none"
            - iris
            - dissolve
    snapshot_entity:
      name: Camera snapshot
      description: >
        Optional camera entity to snapshot and display as the
        announcement backdrop — the natural doorbell path. HACS fetches
        the frame over the LAN, converts it to RGB565, and streams it to
        the dial directly over MQTT (it does not route through Helm). The
        dial suppresses its theme animation while the image arrives. If
        the snapshot can't be fetched, the text announcement is still
        sent. Takes precedence over ``image_url`` if both are set.

        Images render at 360x360 (the universal size that displays on
        every dial; AMOLED dials upscale) since HACS doesn't track each
        dial's hardware type.
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    image_url:
      name: Image URL
      description: >
        Optional image URL to fetch and display as the announcement
        backdrop. Fetched via HA's shared HTTP session, converted to
        RGB565, and streamed to the dial over MQTT. Must return an
        ``image/*`` content type. Ignored if ``snapshot_entity`` is set.
        On fetch failure the text announcement is still sent.
      example: "http://192.168.1.50/snapshot.jpg"
      selector:
        text:

send_countdown:
  name: Send Countdown
  description: >
    Schedule a countdown announcement on a Deckhand dial. The dial shows
    a live counter ticking down to the target moment, then transitions
    to a celebration message + animation at T=0. Optionally swaps to a
    celebration theme at the same moment.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    target_datetime:
      name: Target Moment
      description: When the countdown reaches zero (the celebration moment).
      required: true
      example: "2026-12-31T23:59:59"
      selector:
        datetime:
    message:
      name: Countdown Message
      description: Text shown small below the live counter during the countdown.
      example: "Almost there..."
      selector:
        text:
    celebration_message:
      name: Celebration Message
      description: Text shown when the countdown hits zero.
      required: true
      example: "Happy New Year!"
      selector:
        text:
    celebration_animation:
      name: Celebration Animation
      description: Visual effect that fires at T=0.
      default: "fireworks"
      selector:
        select:
          options:
            - "none"
            - sparkle
            - flash
            - fireworks
            - magic_spell
            - fire
            - waves
            - rain
            - opening_flower
            - falling_leaves
            - confetti
            - snow
            - aurora
            - ripple
    celebration_theme:
      name: Celebration Theme
      description: >
        Optional theme slug to push at T=0. Leave blank to keep the
        dial's current theme. Firmware validates the slug — unknown
        slugs are silently ignored. Use the Theme entity (one per dial)
        to discover what's currently in your team's catalog.
      example: "royale"
      selector:
        text:
    lead_seconds:
      name: Lead Time (seconds)
      description: How long before the target the countdown should start.
      default: 60
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: seconds
    from_name:
      name: From
      description: Who the countdown is from.
      default: "Home Assistant"
      selector:
        text:

start_timer:
  name: Start Timer
  description: >
    Start the dial's Timer face — the same timer a guest starts by hand
    on the glass — from an automation or a voice sentence ("start a ten
    minute timer on the kitchen dial"). Give minutes or seconds; when
    both are set, seconds wins. The dial confirms through its Timer
    event entity (started / completed / cancelled), so a follow-up
    automation can react when it rings. Nothing is retained: a dial
    that is offline when you call this does not start the timer later.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial (or Room) to start the timer on.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    minutes:
      name: Minutes
      description: >
        Length of the timer in minutes (1-1440). Required unless seconds
        is given.
      example: 10
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: minutes
          mode: box
    seconds:
      name: Seconds
      description: >
        Length of the timer in seconds (10-86400), for lengths that are
        not whole minutes. Overrides minutes when both are set.
      example: 90
      selector:
        number:
          min: 10
          max: 86400
          step: 1
          unit_of_measurement: seconds
          mode: box
    label:
      name: Label
      description: >
        Short name shown with the countdown ("Pasta", "Laundry"). Up to
        32 characters; emoji are removed because the dial cannot draw
        them.
      example: "Pasta"
      selector:
        text:
    from_name:
      name: From
      description: Who set the timer, shown on the face.
      default: "Home Assistant"
      selector:
        text:
    name:
      name: Name
      description: >
        Name this timer so several can run at once (up to 3). A start with a
        new name adds a timer; the same name restarts it. Omit for the single
        anonymous timer. Also seeds the label when no label is given.
      example: "Pasta"
      selector:
        text:
    color:
      name: Ring color
      description: >
        Colour of this timer's ring on the dial (#RRGGBB). Omit to let the
        dial pick a distinct colour per slot.
      example: "#C9A84C"
      selector:
        text:

cancel_timer:
  name: Cancel Timer
  description: >
    Stop the dial's running timer and return the dial to its clock. Does
    nothing if no timer is running. The dial fires a cancelled event on
    its Timer entity so anything armed on started can stand down.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial (or Room) whose timer to cancel.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Name
      description: >
        Cancel just this named timer. Omit to cancel every running timer on
        the dial ("cancel the timer").
      example: "Pasta"
      selector:
        text:

add_timer_time:
  name: Add Timer Time
  description: >
    Extend the dial's running timer by a number of seconds ("add five
    minutes"). Does nothing if no timer is running. Capped at one hour
    per call.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial (or Room) whose timer to extend.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    seconds:
      name: Seconds
      description: How many seconds to add (10-3600).
      required: true
      example: 300
      selector:
        number:
          min: 10
          max: 3600
          step: 1
          unit_of_measurement: seconds
          mode: box
    name:
      name: Name
      description: >
        Add time to just this named timer. Omit to target the soonest-to-
        finish timer on the dial.
      example: "Pasta"
      selector:
        text:

reboot:
  name: Reboot
  description: Reboot a Deckhand dial.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to reboot. You can pick several dials, a Room, or type the special id "all" (YAML mode) to target every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true

set_dnd:
  name: Set Do Not Disturb
  description: >
    Set or clear quiet-mode Do Not Disturb on Deckhand dial(s). DND
    silences the dial's haptics (its only sound source) and shows the
    lavender indicator; the dial stays fully usable. The set is retained
    on the broker so an offline dial converges when it reconnects; on
    clear the retained slot is emptied so a stale mode is never
    replayed. The person at the dial always wins: a local change on the
    dial overrides this remote set, and the "Do Not Disturb"
    binary_sensor reflects the dial-reported truth. Requires firmware
    0.4.44+ (older dials ignore the command and their DND sensor shows
    unavailable).
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to set. You can pick several dials, a
        Room, or type the special id "all" (YAML mode) to target every
        dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    # Quoted — bare `on` is YAML-1.1 boolean True and would corrupt the
    # field name in any spec-compliant loader.
    "on":
      name: Do Not Disturb
      description: True to enter Do Not Disturb, false to end it.
      required: true
      selector:
        boolean:

set_timezone:
  name: Set Timezone
  description: >
    Set the per-dial timezone. Accepts an IANA name (e.g.
    "America/Los_Angeles"). Routed through Helm, which records it against
    the dial and converts it to the POSIX TZ string the firmware passes
    straight to setenv("TZ", ...), so the clock face and any time
    rendering immediately reflect the new zone — and the change survives
    the next full config push. Schedules continue to fire correctly
    because the wire format is epoch.

    Equivalent to the "timezone" field of Set Dial Settings; kept as its
    own service so existing automations keep working.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to retime.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    timezone:
      name: IANA Timezone
      description: IANA name like "America/New_York" or "Europe/Paris".
      required: true
      example: "America/New_York"
      selector:
        select:
          options:
            - "UTC"
            - "America/Los_Angeles"
            - "America/Vancouver"
            - "America/Denver"
            - "America/Phoenix"
            - "America/Chicago"
            - "America/Mexico_City"
            - "America/New_York"
            - "America/Toronto"
            - "America/Anchorage"
            - "America/Sao_Paulo"
            - "Pacific/Honolulu"
            - "Europe/London"
            - "Europe/Paris"
            - "Europe/Berlin"
            - "Europe/Madrid"
            - "Europe/Rome"
            - "Europe/Amsterdam"
            - "Europe/Stockholm"
            - "Europe/Athens"
            - "Africa/Cairo"
            - "Africa/Johannesburg"
            - "Asia/Dubai"
            - "Asia/Kolkata"
            - "Asia/Singapore"
            - "Asia/Hong_Kong"
            - "Asia/Shanghai"
            - "Asia/Seoul"
            - "Asia/Tokyo"
            - "Australia/Perth"
            - "Australia/Brisbane"
            - "Australia/Sydney"
            - "Australia/Melbourne"
            - "Pacific/Auckland"

set_dial_settings:
  name: Set Dial Settings
  description: >
    Change any subset of a dial's sticky settings in one call — clock
    face and format, label, timezone and haptics. Every field is
    optional; only the ones you fill in are sent, so an automation can
    nudge a single setting without disturbing the rest.

    Routed through Helm, which writes the values to the dial's record and
    then republishes the dial's complete configuration. That is what
    makes a change stick: settings pushed straight at the hardware are
    overwritten the next time Helm pushes a full config (on boot, on
    "Push to dial", or on any settings save).

    Validation is all-or-nothing — if one field is invalid, nothing is
    applied.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to configure. You can pick several
        dials, a Room, or type the special id "all" (YAML mode) to target
        every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    clock_face_pref:
      name: Clock Face
      description: >
        Auto follows the active theme's recommendation. Digital forces
        the numerals; Analog forces the hands on any theme that supports
        them; Both renders hands and numerals together.
      required: false
      example: "analog"
      selector:
        select:
          options:
            - label: "Auto (theme default)"
              value: "auto"
            - label: "Digital"
              value: "digital"
            - label: "Analog"
              value: "analog"
            - label: "Both (hybrid)"
              value: "both"
    clock_format:
      name: Clock Format
      description: 12- or 24-hour numerals on the digital face.
      required: false
      example: "12h"
      selector:
        select:
          options:
            - label: "12-hour"
              value: "12h"
            - label: "24-hour"
              value: "24h"
    label:
      name: Label
      description: >
        Display name shown above the clock. Leave empty to fall back to
        the dial's hardware id. Max 64 characters.
      required: false
      example: "Galley"
      selector:
        text:
    hide_label:
      name: Hide Label
      description: >
        Suppress the label above the clock entirely, for a completely
        clean face.
      required: false
      selector:
        boolean:
    timezone:
      name: IANA Timezone
      description: >
        IANA name like "America/New_York". Converted to the firmware's
        POSIX TZ format by Helm.
      required: false
      example: "America/New_York"
      selector:
        select:
          options:
            - "UTC"
            - "America/Los_Angeles"
            - "America/Vancouver"
            - "America/Denver"
            - "America/Phoenix"
            - "America/Chicago"
            - "America/Mexico_City"
            - "America/New_York"
            - "America/Toronto"
            - "America/Anchorage"
            - "America/Sao_Paulo"
            - "Pacific/Honolulu"
            - "Europe/London"
            - "Europe/Paris"
            - "Europe/Berlin"
            - "Europe/Madrid"
            - "Europe/Rome"
            - "Europe/Amsterdam"
            - "Europe/Stockholm"
            - "Europe/Athens"
            - "Africa/Cairo"
            - "Africa/Johannesburg"
            - "Asia/Dubai"
            - "Asia/Kolkata"
            - "Asia/Singapore"
            - "Asia/Hong_Kong"
            - "Asia/Shanghai"
            - "Asia/Seoul"
            - "Asia/Tokyo"
            - "Australia/Perth"
            - "Australia/Brisbane"
            - "Australia/Sydney"
            - "Australia/Melbourne"
            - "Pacific/Auckland"
    haptic_intensity:
      name: Haptic Intensity
      description: 0 = off, 1 = light, 2 = normal, 3 = strong.
      required: false
      example: 2
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: slider
    haptic_encoder:
      name: Haptic Encoder Ticks
      description: Buzz on each detent as the knob is turned.
      required: false
      selector:
        boolean:
    haptic_notify:
      name: Haptic Notification Buzz
      description: Buzz when a notification arrives.
      required: false
      selector:
        boolean:
    haptic_confirm:
      name: Haptic Action Confirmation
      description: Buzz when a touch-and-hold action commits.
      required: false
      selector:
        boolean:

set_sunset:
  name: Set Sunset (Sundowner)
  description: >
    Anchor the Sundowner theme's clock mode to a real sunset. In clock
    mode the on-dial sun descends toward the horizon and sinks at the
    anchored sunset time instead of free-running on a loop. Provide the
    sunset EITHER as an explicit timestamp (``sunset_at``) OR by reading
    it from an entity (``entity_id``, e.g. ``sun.sun``) — Home Assistant
    hands over a timestamp far more easily than a lat/long. One-shot:
    ``sun.sun``'s next-setting rolls to tomorrow once today's sunset
    passes, so call this daily from an automation (a Sun trigger or a
    time pattern) to keep the anchor fresh. Only affects dials running
    the Sundowner theme in clock mode; others ignore it.
  fields:
    device_id:
      name: Device
      description: >
        The Deckhand dial device(s) to anchor. You can pick several
        dials, a Room, or type the special id "all" (YAML mode) to target
        every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    entity_id:
      name: Sun entity
      description: >
        Entity to read the sunset from — normally ``sun.sun``. The
        integration reads the ``attribute`` below (default
        ``next_setting``) and converts it to a Unix epoch. Falls back to
        the entity's own state if the attribute is absent, so a timestamp
        sensor or an input_datetime works too. Ignored when ``sunset_at``
        is supplied.
      example: "sun.sun"
      selector:
        entity:
          domain:
            - sun
            - sensor
            - input_datetime
    attribute:
      name: Attribute
      description: >
        Which attribute on ``entity_id`` holds the sunset timestamp.
        Defaults to ``next_setting`` (the standard ``sun.sun`` field).
      default: "next_setting"
      example: "next_setting"
      selector:
        text:
    sunset_at:
      name: Sunset time (explicit)
      description: >
        An explicit sunset as a Unix epoch (seconds), an ISO-8601
        timestamp, or a datetime. Wins over ``entity_id`` when both are
        given. Send ``0`` to clear the anchor and return the dial to the
        theme's manual "HH:MM" fallback.
      example: "2026-07-22T20:14:00-07:00"
      selector:
        text:

apply_overlay:
  name: Apply Overlay
  description: >
    Apply a transient runtime overlay to a dial without replacing the
    saved theme or face. Use for reactive automations — "flash a sensor
    quadrant face when air quality spikes", "bump brightness on motion",
    "show a subtitle alert for 10 minutes". Distinct from
    ``mount_face``: that one writes RETAINED face state that survives
    reboot. ``apply_overlay`` is ephemeral by default; set ``ttl_s`` for
    an auto-revert timer. Any field left unset keeps the dial's current
    value.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    subtitle_mode:
      name: Subtitle mode
      description: >
        How the dial picks the subtitle source. ``theme`` follows the
        theme default, ``custom`` shows the ``subtitle_text`` you provide,
        ``date`` / ``date_year`` show the calendar date,
        ``ical_next_event`` shows your next upcoming calendar event
        (materialized server-side from your configured iCal/Google
        Calendar feeds), ``none`` hides the subtitle entirely.
      example: "custom"
      selector:
        select:
          options:
            - "theme"
            - "custom"
            - "date"
            - "date_year"
            - "ical_next_event"
            - "none"
    subtitle_text:
      name: Subtitle text
      description: >
        Transient subtitle flash under the clock. Use for short-lived
        notifications. Supplying text without picking a mode auto-flips
        the dial into ``custom`` so the text is actually shown; passing
        text together with a mode other than ``custom`` (e.g. ``date``)
        also auto-flips to ``custom`` so the typed text wins.

        Caveat: subtitle lives in the clock face's own mount payload on
        the firmware side, so this override is **best-effort and
        short-lived** — the next clock face mount (push from Helm,
        reboot, etc.) clobbers it. For a subtitle that must persist,
        send a clock face mount with the subtitle baked into the
        payload instead of using apply_overlay.
      example: "Lightning detected"
      selector:
        text:
    home_face:
      name: Home Face
      description: >
        Which face the dial home screen renders. ``clock`` is the
        default; ``sensor`` enables the 1-4 quadrant readouts (see the
        sensor_* fields below); ``message`` shows a big centered string
        (see ``home_message``); ``framecast`` / ``volume`` / ``blank`` /
        ``image`` are their dedicated faces. Persistent face
        state should be set via ``mount_face``; this is the
        transient-flash variant.
      example: "sensor"
      selector:
        select:
          options:
            - "theme"
            - "clock"
            - "message"
            - "sensor"
            - "image"
            - "blank"
            - "volume"
            - "framecast"
    home_message:
      name: Home Message
      description: Large message shown when ``home_face`` is ``message``.
      example: "Storm warning"
      selector:
        text:
    sensor_entity_id:
      name: Sensor entity ID (slot 1)
      description: >
        HA entity to display when ``home_face`` is ``sensor``. The
        integration publishes the entity's current value immediately and
        keeps it in sync as it changes.
      example: "sensor.living_room_temperature"
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - number
            - input_number
    sensor_label:
      name: Sensor label (slot 1)
      description: Display label for the slot-1 sensor.
      example: "Living"
      selector:
        text:
    sensor_quad_2_entity_id:
      name: Quad slot 2 entity
      description: HA entity for the second quadrant of the sensor face.
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - number
            - input_number
    sensor_quad_2_label:
      name: Quad slot 2 label
      description: Display label for the slot-2 sensor.
      selector:
        text:
    sensor_quad_3_entity_id:
      name: Quad slot 3 entity
      description: HA entity for the third quadrant of the sensor face.
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - number
            - input_number
    sensor_quad_3_label:
      name: Quad slot 3 label
      description: Display label for the slot-3 sensor.
      selector:
        text:
    sensor_quad_4_entity_id:
      name: Quad slot 4 entity
      description: HA entity for the fourth quadrant of the sensor face.
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - number
            - input_number
    sensor_quad_4_label:
      name: Quad slot 4 label
      description: Display label for the slot-4 sensor.
      selector:
        text:
    sensor_marquee:
      name: Marquee entities
      description: >
        Up to 12 sensors that scroll across the dial as a marquee.
        Pass a YAML list of either bare entity ids
        (``- sensor.outdoor_temp``) or per-entry objects
        (``- entity_id: sensor.x`` / ``label: "..."`` / ``unit: "F"``).
      example: |
        - sensor.outdoor_temp
        - entity_id: sensor.living_humidity
          label: Humidity
        - entity_id: sensor.battery_pct
          label: Battery
          unit: "%"
      selector:
        object:
    framecast_frame_id:
      name: FrameCast frame ID
      description: >
        Configured Samsung Frame TV UUID. Empty = "auto pick the only
        Frame", which the server resolves before pushing cmd/framecast.
      example: ""
      selector:
        text:
    brightness:
      name: Brightness
      description: >
        Display brightness (0-100). Without ``ttl_s`` this sets the dial's
        persistent brightness CAP (night dim; dial firmware newer than 0.4.169): the
        dial never shows brighter than this — through theme changes, Wi-Fi
        reconnects, reboots and other overlays' reverts — until it is lifted.
        Sending a level at or above the current theme's brightness (100 always
        works) lifts the cap. A cap-only overlay does not wake the screen.
        With ``ttl_s`` it is a temporary brightness that reverts when the
        timer ends, still under any cap.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    hide_label:
      name: Hide Label
      description: >
        When true, the dial stops rendering its label above the clock.
        One-shot — survives until the next overlay or reboot. To make
        the change persistent, save the dial-level "Hide Label" setting
        in Helm or Console.
      selector:
        boolean:
    ttl_s:
      name: TTL (seconds)
      description: >
        If set, the firmware reverts to the last full theme after this
        many seconds. Omit or set to 0 for a sticky overlay.
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: seconds

update_now_playing:
  name: Update Now Playing
  description: >
    Stream a now-playing update to a dial's home face. Lightweight,
    high-frequency — fire on track change, not on every progress tick.
    Leave title blank to revert the dial to its theme-default home face.
    Ephemeral — not persisted across reboot.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    title:
      name: Track title
      description: Blank reverts the dial to its theme-default home face.
      example: "Dreams"
      selector:
        text:
    artist:
      name: Artist
      description: Shown under the title. Leave blank to show the title alone.
      example: "Fleetwood Mac"
      selector:
        text:
    album_art_url:
      name: Album art URL
      description: Optional — sent to the dial as-is, so it must be a baseline JPEG the dial can reach without credentials. For a Home Assistant media player use update_from_media_player instead, which serves the art transcoded.
      selector:
        text:
    source:
      name: Source label
      description: Free text. e.g. "Sonos", "AirPlay", "Jellyfin".
      example: "Sonos"
      selector:
        text:
    is_playing:
      name: Is playing
      description: When false, the face stays visible but dimmed.
      default: true
      selector:
        boolean:
    entity_id:
      name: Source entity (optional)
      description: >
        HA media_player entity id this update represents. When set, a
        play/pause click on the dial controls THIS entity. When omitted,
        the dial falls back to the room's default media_player binding.
      example: "media_player.jellyfin_galaxy_tab"
      selector:
        entity:
          domain: media_player

update_from_media_player:
  name: Update From Media Player
  description: >
    Read the current state of a media_player entity and stream it to a
    Deckhand dial's now-playing face. Handles title, artist (or series
    title for video), album art / poster, source, and playback state.
    For always-on auto-push, configure a binding in the integration's
    options instead of calling this service manually.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    entity_id:
      name: Media Player
      description: The media_player entity to mirror.
      required: true
      example: "media_player.living_room_tv"
      selector:
        entity:
          domain: media_player

update_sensor_value:
  name: Update Sensor Value
  description: >
    Stream a sensor value update to a dial. Refreshes the sensor home face
    in place when visible, otherwise buffered. Ephemeral.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial device to target.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    entity_id:
      name: Source entity
      description: >
        HA entity id this reading belongs to. The dial matches the value to
        the sensor face slot showing this entity.
      required: true
      example: "sensor.living_room_temp"
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - number
            - input_number
    label:
      name: Label
      description: Short label shown above the value.
      example: "Living Room"
      selector:
        text:
    value:
      name: Value
      description: String or number. Rendered verbatim on the dial.
      required: true
      example: "72"
      selector:
        text:
    unit:
      name: Unit
      description: Unit shown after the value. Leave blank for none.
      example: "°F"
      selector:
        text:
    color:
      name: Tint color
      description: >
        Optional tint for the value, as a hex colour "#RRGGBB" (for
        example "#FFD700"). Leave blank for the default colour.
      example: "#FFD700"
      selector:
        text:

# ── Phase 6 dial-platform — face dispatch services ──────────────────────
# Faces are functional UI layers (the Perimeter Ring overlay, future room-aware
# faces). Themes are atmosphere; faces are function. A face is mounted
# onto a dial and either takes over the screen entirely
# (FACE_OWNS_SCREEN) or paints a thin overlay on top of the active
# theme (default — the Perimeter Ring overlay uses this mode; the
# full-screen Perimeter Pulse face is retired).

mount_perimeter_ring:
  name: Mount Perimeter Ring
  description: >
    Mount the Perimeter Ring LAYER on a dial. The ring wraps the rim
    of the round display and composites over whatever face the dial is
    showing (clock, sensor, charge, now playing...) - it is a layer, not a
    face, and never takes over the screen. Each binding owns an angular segment rendered via
    a treatment (state_color / flash / bounce). Retained - the dial
    re-mounts the same ring on reboot. Take it down with
    clear_perimeter_ring. Mounting also unmounts and clears the retired
    full-screen Perimeter Pulse face so a stale retained mount of it
    cannot resurrect on reconnect.

    Live by default: every binding whose id is an entity in this Home
    Assistant is fed by the integration itself - a state change reaches
    the dial within a second, folded to the binding's active_state
    (on = open, off = closed, ...) and through numeric_threshold the same
    way Helm's and Console's pollers do. Set live_state to false to drive
    the ring only from your own automations with update_perimeter_state
    (e.g. custom state strings computed by a template).
  fields:
    device_id:
      name: Device
      description: The Deckhand dial to mount the face on.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    bindings:
      name: Bindings
      description: >
        Array (max 16) of { id (required: the entity_id, at most 64
        characters - the dial matches live state by the whole id),
        friendly_name, angular_center (degrees, 0 = 12 o'clock,
        clockwise; leave it out and the bindings are spread evenly - arcs
        that would overlap are re-spaced evenly), angular_width (degrees,
        default 24, ignored when contiguous), treatment, state,
        active_state (default "on" - the state that lights the segment),
        base_color "#RRGGBB", active_color "#RRGGBB", value (0-1),
        opacity (0-1, overrides bar_opacity), numeric_threshold,
        above_state, below_state }. Treatments: state_color (solid
        colour change - doors, locks), flash (blinks while active -
        alarms, leaks), bounce (hops inward, then settles - doorbell,
        motion). Retired names still work: ripple / sweep / blink become
        flash, gradient becomes state_color. The numeric_threshold trio:
        float(entity state) > threshold sends above_state, else
        below_state (the live feed and Helm's poller both do this; the
        dial itself only string-matches).
      required: true
      example: |
        - id: lock.front_door
          friendly_name: Front Door
          treatment: state_color
          active_state: unlocked
          base_color: "#68C8D8"
          active_color: "#E89858"
        - id: binary_sensor.living_room_motion
          friendly_name: Living Room
          treatment: bounce
          active_state: "on"
          base_color: "#3A4A5A"
          active_color: "#9AC8E8"
        # Grid energy: exporting lights the segment green. The live
        # feed compares float(state) > numeric_threshold and sends
        # above_state / below_state.
        - id: sensor.grid_power
          friendly_name: Grid
          angular_width: 40
          treatment: state_color
          active_state: exporting
          numeric_threshold: 0
          above_state: exporting
          below_state: importing
          base_color: "#30435C"
          active_color: "#3FAE6A"
      selector:
        object:
    contiguous:
      name: Contiguous Ring
      description: >
        When true, the bindings split the whole rim into equal segments
        in list order (angular_center and angular_width are ignored).
        When false (default), each segment uses its own angular_width
        with empty space in between.
      default: false
      selector:
        boolean:
    theme_colors:
      name: Follow Theme Colours
      description: >
        When true, the ring takes its calm and alert colours from the
        dial's active theme (re-resolved on every theme change) and the
        per-binding base_color / active_color are ignored. Firmware
        0.4.158+.
      default: false
      selector:
        boolean:
    hide_when_calm:
      name: Hide When Calm
      description: >
        When true, the ring slides off the rim while every binding is
        calm and slides back the moment one goes active. Firmware
        0.4.161+.
      default: false
      selector:
        boolean:
    live_state:
      name: Live State
      description: >
        When true (default), the integration feeds every binding whose id
        is an entity in this Home Assistant with its live state. Turn off
        to drive the ring only from your own automations with
        update_perimeter_state.
      default: true
      selector:
        boolean:
    bar_thickness:
      name: Bar Thickness
      description: Bar width in pixels. Default 7. Range 1-40.
      default: 7
      selector:
        number:
          min: 1
          max: 40
          unit_of_measurement: px
    bar_opacity:
      name: Bar Opacity
      description: >
        Face-level opacity 0-1. Default 0.94 — clear-as-day; lower values
        let the theme breathe through. Per-binding opacity overrides if
        set on a binding.
      default: 0.94
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    # subtitle_text removed — DEAD as of firmware 0.4.21. The narrative
    # line renders the dial's normal subtitle (apply_overlay machinery),
    # so the face never contradicts the operator's subtitle.

mount_perimeter_pulse:
  name: Mount Perimeter Ring (legacy name)
  description: >
    Legacy name for mount_perimeter_ring, kept so existing automations
    keep working. The full-screen Perimeter Pulse face is retired; this
    service now mounts the Perimeter Ring layer (same bindings and
    appearance fields) over the dial's current face, and unmounts the
    retired pulse face on the way. New automations should call
    mount_perimeter_ring; behaviour is identical (live by default, see
    live_state).
  fields:
    device_id:
      name: Device
      description: The Deckhand dial to mount the face on.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    bindings:
      name: Bindings
      description: >
        Array (max 16) of { id (required: the entity_id, at most 64
        characters - the dial matches live state by the whole id),
        friendly_name, angular_center (degrees, 0 = 12 o'clock,
        clockwise; leave it out and the bindings are spread evenly - arcs
        that would overlap are re-spaced evenly), angular_width (degrees,
        default 24, ignored when contiguous), treatment, state,
        active_state (default "on" - the state that lights the segment),
        base_color "#RRGGBB", active_color "#RRGGBB", value (0-1),
        opacity (0-1, overrides bar_opacity), numeric_threshold,
        above_state, below_state }. Treatments: state_color (solid
        colour change - doors, locks), flash (blinks while active -
        alarms, leaks), bounce (hops inward, then settles - doorbell,
        motion). Retired names still work: ripple / sweep / blink become
        flash, gradient becomes state_color. The numeric_threshold trio:
        float(entity state) > threshold sends above_state, else
        below_state (the live feed and Helm's poller both do this; the
        dial itself only string-matches).
      required: true
      example: |
        - id: lock.front_door
          friendly_name: Front Door
          treatment: state_color
          active_state: unlocked
          base_color: "#68C8D8"
          active_color: "#E89858"
        - id: binary_sensor.living_room_motion
          friendly_name: Living Room
          treatment: bounce
          active_state: "on"
          base_color: "#3A4A5A"
          active_color: "#9AC8E8"
        # Grid energy: exporting lights the segment green. The live
        # feed compares float(state) > numeric_threshold and sends
        # above_state / below_state.
        - id: sensor.grid_power
          friendly_name: Grid
          angular_width: 40
          treatment: state_color
          active_state: exporting
          numeric_threshold: 0
          above_state: exporting
          below_state: importing
          base_color: "#30435C"
          active_color: "#3FAE6A"
      selector:
        object:
    contiguous:
      name: Contiguous Ring
      description: >
        When true, the bindings split the whole rim into equal segments
        in list order (angular_center and angular_width are ignored).
        When false (default), each segment uses its own angular_width
        with empty space in between.
      default: false
      selector:
        boolean:
    theme_colors:
      name: Follow Theme Colours
      description: >
        When true, the ring takes its calm and alert colours from the
        dial's active theme (re-resolved on every theme change) and the
        per-binding base_color / active_color are ignored. Firmware
        0.4.158+.
      default: false
      selector:
        boolean:
    hide_when_calm:
      name: Hide When Calm
      description: >
        When true, the ring slides off the rim while every binding is
        calm and slides back the moment one goes active. Firmware
        0.4.161+.
      default: false
      selector:
        boolean:
    live_state:
      name: Live State
      description: >
        When true (default), the integration feeds every binding whose id
        is an entity in this Home Assistant with its live state. Turn off
        to drive the ring only from your own automations with
        update_perimeter_state.
      default: true
      selector:
        boolean:
    bar_thickness:
      name: Bar Thickness
      description: Bar width in pixels. Default 7. Range 1-40.
      default: 7
      selector:
        number:
          min: 1
          max: 40
          unit_of_measurement: px
    bar_opacity:
      name: Bar Opacity
      description: >
        Face-level opacity 0-1. Default 0.94 — clear-as-day; lower values
        let the theme breathe through. Per-binding opacity overrides if
        set on a binding.
      default: 0.94
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    # subtitle_text removed — DEAD as of firmware 0.4.21. The narrative
    # line renders the dial's normal subtitle (apply_overlay machinery),
    # so the face never contradicts the operator's subtitle.

update_perimeter_state:
  name: Update Perimeter State
  description: >
    Push state for one or more perimeter ring bindings yourself. Rings
    whose bindings are entities are already fed live (see live_state on
    mount_perimeter_ring, and Helm's / Console's pollers), so this is for
    rings mounted with live_state off, bindings that are not entities, or
    custom state strings computed by a template, e.g. state: "{{ 'exporting' if
    states('sensor.grid_power')|float(0) > 0 else 'importing' }}" - the
    dial string-matches against the binding's active_state. Set
    "event: true" to replay the binding's alert animation. Updates the
    Perimeter Ring layer (cmd/face/perimeter_ring/state) whether it was
    mounted with mount_perimeter_ring, through Helm / Console, or
    authored on a sensor, clock or charge face.
  fields:
    device_id:
      name: Device
      description: Dial(s) whose Perimeter Ring gets the new state. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    states:
      name: Bindings to update
      description: >
        Array of state updates. Each entry is { id, state, value, event }.
        id is the binding id (the entity_id it was mounted with). At
        minimum supply id and either state or value (0-1, clamped). Set
        event=true to replay the binding's flash / bounce.
      required: true
      example: |
        - id: lock.front_door
          state: unlocked
        - id: binary_sensor.living_room_motion
          state: "on"
          event: true
        - id: sensor.grid_power
          state: exporting
      selector:
        object:
    layer:
      name: Ring layer
      description: >
        Kept for automations written when the full-screen Perimeter Pulse
        face still existed. "ring" (the default) is the Perimeter Ring
        overlay; "pulse" is a retired alias that now reaches the same
        ring. Either way the update goes to cmd/face/perimeter_ring/state.
      required: false
      default: "ring"
      example: "ring"
      selector:
        select:
          options:
            - "pulse"
            - "ring"

clear_perimeter_ring:
  name: Clear Perimeter Ring
  description: >
    Take the Perimeter Ring layer off a dial and keep it off: unmounts it
    and clears its retained mount, so a reconnect cannot bring it back.
    The face underneath is left exactly as it is. Also sweeps the retired
    full-screen Perimeter Pulse face, and stops the integration's live
    feed for that dial.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial (or room) to clear the ring from.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true

mount_face:
  name: Mount Face (Generic)
  description: >
    Generic escape hatch — mount any registered face by id with a free-
    form payload dict. Used for forward compatibility with faces the
    HACS integration doesn't know about yet. Never takes the perimeter
    ring down: the dial keeps its home ring. A payload with its own
    perimeter block mounts that face's ring beside it (Helm / Console put
    the home ring back when the face goes).
  fields:
    device_id:
      name: Device
      description: Dial(s) to mount the face on. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    face_id:
      name: Face ID
      description: Face identifier registered in firmware.
      required: true
      example: "perimeter_ring"
      selector:
        text:
    payload:
      name: Payload
      description: Free-form dict — passed through to the face's on_mount.
      required: true
      example: |
        contiguous: true
        bindings: []
      selector:
        object:
    retained:
      name: Retain
      description: When true, retained on the broker so the face survives reboot.
      default: true
      selector:
        boolean:

unmount_face:
  name: Unmount Face
  description: >
    Dismiss the named face and return the dial to its theme's clock.
    The face_id must be the face that is up: on firmware 0.4.123 and
    later a different id is a no-op. Also clears the retained mount so
    a broker reconnect doesn't resurrect the dismissed face. Pair with
    mount_face for reactive faces (e.g. the Charge face when an EV
    session ends).
  fields:
    device_id:
      name: Device
      description: Dial(s) to dismiss the face from. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    face_id:
      name: Face ID
      description: Face identifier to unmount; the face currently mounted (matches the mount).
      required: true
      example: "charge"
      selector:
        text:

add_menu_item:
  name: Add Menu Item (Temporary)
  description: >
    Add (or update, by key) a contextual menu item on the targeted dials.
    Creates a real menu item on each dial's configured menu in Helm — it
    shows in every layout, appears in the operator's menu editor, and
    syncs to Salesforce. Selecting it on the dial fires a
    deckhand_dial_event on the HA event bus, so pair this with an
    automation that reacts to the press. With a TTL the item disappears
    from the dials when the window closes and cleans itself up.
    Examples: "Close Garage" while the door is open, "Movie Mode" for
    the evening, "Dismiss" while the laundry is done.
  fields:
    device_id:
      name: Device
      description: >
        Dial(s) whose menu gets the item. You can pick several dials, a
        Room, or type the special id "all" (YAML mode) for every dial.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    key:
      name: Key
      description: >
        Your idempotency handle. Re-adding with the same key updates the
        item in place; remove_menu_item deletes by this key. The key is
        NOT in the dial's press event — a press carries only item_id (the
        server's id for the item) and item_label — so branch on the label:
        the "Menu item selected" device trigger takes it as an option.
      required: true
      example: "garage_open"
      selector:
        text:
    label:
      name: Label
      description: Menu label shown on the dial (ASCII, up to 64 chars).
      required: true
      example: "Close Garage"
      selector:
        text:
    icon:
      name: Icon
      description: Optional FontAwesome slug shown beside the label.
      example: "fa-warehouse"
      selector:
        text:
    ttl:
      name: Time to live
      description: >
        Optional lifetime in seconds. When it elapses the item vanishes
        from the dials (within a minute) and the row cleans itself up.
        Omit for a sticky item you remove explicitly.
      example: 3600
      selector:
        number:
          min: 60
          max: 86400
          unit_of_measurement: seconds
          mode: box
    item_type:
      name: Item Type (advanced)
      description: >
        Helm menu item type. Default ha_service — a simple button whose
        press lands on the HA event bus. Other types (ha_toggle,
        ha_light, ...) need matching action_data.
      example: "ha_service"
      selector:
        text:
    climate_min_temp:
      name: Minimum Temperature
      description: >
        For ha_climate items — the coldest the dial may be turned to. Leave
        unset to use the thermostat's own range. A range wider than the
        thermostat supports is narrowed to fit, so the dial never offers a
        temperature the device would refuse.
      example: 65
      selector:
        number:
          min: -50
          max: 150
          step: 1
          mode: box
    climate_max_temp:
      name: Maximum Temperature
      description: >
        For ha_climate items — the warmest the dial may be turned to. Leave
        unset to use the thermostat's own range.
      example: 78
      selector:
        number:
          min: -50
          max: 150
          step: 1
          mode: box
    activation_mode:
      name: Activation
      description: >
        How the item commits on the dial. "click" is a single tap and is
        the default. "hold" opens a short press-and-hold screen — a
        deliberate second gesture that twisting cancels — for items you
        do not want a brush past the dial to fire, like starting a
        coffee maker.
      example: "hold"
      default: "click"
      selector:
        select:
          options:
            - label: Single click
              value: click
            - label: Press and hold
              value: hold
    action_data:
      name: Action Data (advanced)
      description: >
        Optional dict merged into the item's action_data (entity ids
        etc. for directly-bound item types). An ha_art (Art Gallery)
        item's entity_id must be a media_player; any other entity is
        refused with an error.
      selector:
        object:

remove_menu_item:
  name: Remove Menu Item (Temporary)
  description: >
    Remove a temporary menu item previously added with add_menu_item,
    matched by key. Only HA-authored items are ever removed — the
    operator's configured menu is untouched.
  fields:
    device_id:
      name: Device
      description: >
        Dial(s) to remove the item from. Multiple, Rooms, or "all"
        (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    key:
      name: Key
      description: The key used when the item was added.
      required: true
      example: "garage_open"
      selector:
        text:

create_alarm:
  name: Create Alarm
  description: >
    Create or update (by name) a wake-up alarm on the targeted dials.
    The Helm scheduler fires it: sunrise LED ramp, then ring; on-dial
    snooze/dismiss gestures work as always and relay to the HA event
    bus (alarm_snooze / alarm_dismiss).
  fields:
    device_id:
      name: Device
      description: Dial(s). Multiple, Rooms, or "all" (YAML) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Alarm Name
      description: The alarm's handle — reuse it to update/enable/disable.
      required: true
      example: "Wake Tyler"
      selector:
        text:
    time:
      name: Fire Time
      description: Local fire time, 24h HH:MM.
      required: true
      example: "06:45"
      selector:
        time:
    days:
      name: Days of Week
      description: >
        Empty/omitted = every day (unless a one-time date is set).
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "0"
            - label: Tuesday
              value: "1"
            - label: Wednesday
              value: "2"
            - label: Thursday
              value: "3"
            - label: Friday
              value: "4"
            - label: Saturday
              value: "5"
            - label: Sunday
              value: "6"
    one_time_date:
      name: One-Time Date
      description: >
        Fire once on this date (YYYY-MM-DD) then auto-disable — the
        hotel/Airbnb "wake me tomorrow" shape.
      example: "2026-08-01"
      selector:
        date:
    label:
      name: Ringing Label
      description: Text on the ringing face (defaults to the alarm name).
      example: "Rise and shine"
      selector:
        text:
    snooze_minutes:
      name: Snooze Minutes
      description: How long a snooze on the dial holds off the ring.
      default: 9
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes
    sunrise_duration_s:
      name: Sunrise Duration (seconds)
      description: LED sunrise ramp length before the ring. 0 disables.
      default: 900
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    sunrise_color:
      name: Sunrise Color
      description: >
        A hex colour "#RRGGBB" (for example "#FFC66E", the default) handed
        to pre-alarm automations, e.g. to tint bedroom lights. The dial
        itself no longer draws a sunrise colour.
      example: "#FFC66E"
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn off to save the alarm without arming it.
      default: true
      selector:
        boolean:

enable_alarm:
  name: Enable Alarm
  description: Re-enable a named alarm.
  fields:
    device_id:
      name: Device
      description: Dial(s) the alarm belongs to. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Alarm Name
      description: The name the alarm was created with.
      required: true
      example: "Wake Tyler"
      selector:
        text:

disable_alarm:
  name: Disable Alarm
  description: >
    Disable a named alarm without deleting it (vacation mode). Matches
    the dial's own alarm first, then any team alarm with that name —
    so HA can pause an operator-authored wake-up too.
  fields:
    device_id:
      name: Device
      description: Dial(s) the alarm belongs to. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Alarm Name
      description: The name the alarm was created with.
      required: true
      example: "Wake Tyler"
      selector:
        text:

snooze_alarm:
  name: Snooze Alarm
  description: Snooze the actively ringing/sunrising alarm on the dial(s).
  fields:
    device_id:
      name: Device
      description: Dial(s) whose ringing alarm to snooze. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true

dismiss_alarm:
  name: Dismiss Alarm
  description: Dismiss the active alarm on the dial(s).
  fields:
    device_id:
      name: Device
      description: Dial(s) whose ringing alarm to dismiss. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true

enroll_credential:
  name: Enroll Credential
  description: >
    Promote an NFC tap into a credential (tap-first, assign-later). Tap
    the new card/fob on the dial, then call this within 15 minutes —
    the most recent unrecognized tap on that dial is enrolled. Identity
    and Role are created by name if they don't exist.
  fields:
    device_id:
      name: Device
      description: The dial the card was tapped on.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    identity_name:
      name: Identity Name
      description: Who the card belongs to. Created if it doesn't exist yet.
      required: true
      example: "Guest Ana"
      selector:
        text:
    role:
      name: Role
      description: Default role for this credential (created if new).
      required: true
      example: "Guest"
      selector:
        text:
    label:
      name: Label
      description: Optional note to tell this card apart from the identity's others.
      example: "Blue fob"
      selector:
        text:
    uid_hash:
      name: UID Hash (advanced)
      description: >
        Explicit 64-char credential hash. Omit to use the latest
        unrecognized tap on the dial.
      selector:
        text:

revoke_credential:
  name: Revoke Credential
  description: >
    Revoke every active credential for an identity — the checkout
    automation ("guest checked out → their fob stops working").
    Restorable with restore_credential.
  fields:
    device_id:
      name: Device
      description: Any dial (identity match is team-wide).
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    identity_name:
      name: Identity Name
      description: Every active credential for this identity is revoked.
      required: true
      example: "Guest Ana"
      selector:
        text:

restore_credential:
  name: Restore Credential
  description: Restore previously revoked credentials for an identity.
  fields:
    device_id:
      name: Device
      description: Any dial (identity match is team-wide).
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    identity_name:
      name: Identity Name
      description: Every revoked credential for this identity is restored.
      required: true
      example: "Guest Ana"
      selector:
        text:

create_schedule:
  name: Create Schedule
  description: >
    Create or update (by name) a Helm schedule. When it fires it can
    push a theme, switch the menu, and/or show an announcement.
    Triggers: recurring time (with days), one-time date, HA webhook,
    or sunset. Targets default to the addressed dial.
  fields:
    device_id:
      name: Device
      description: Dial(s). Multiple, Rooms, or "all" (YAML) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Schedule Name
      description: The schedule's handle — reuse it to update, enable, disable or fire it.
      required: true
      example: "Evening Scene"
      selector:
        text:
    trigger_type:
      name: Trigger
      description: >
        What fires the schedule. ``time`` repeats at Fire Time on the chosen
        days (or hourly, see Recurrence); ``one_time`` fires once on
        One-Time Date; ``ha_webhook`` fires when the webhook slug is called;
        ``sunset`` fires at local sunset.
      default: "time"
      selector:
        select:
          options:
            - "time"
            - "one_time"
            - "ha_webhook"
            - "sunset"
    time:
      name: Fire Time
      description: Local 24h HH:MM (time / one_time triggers).
      example: "19:30"
      selector:
        time:
    days:
      name: Days of Week
      description: Empty = daily.
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "0"
            - label: Tuesday
              value: "1"
            - label: Wednesday
              value: "2"
            - label: Thursday
              value: "3"
            - label: Friday
              value: "4"
            - label: Saturday
              value: "5"
            - label: Sunday
              value: "6"
    recurrence:
      name: Recurrence
      description: daily (default) or hourly (uses interval fields).
      selector:
        select:
          options:
            - "daily"
            - "hourly"
    one_time_date:
      name: One-Time Date
      description: The date a one_time trigger fires on (YYYY-MM-DD).
      example: "2026-08-02"
      selector:
        date:
    interval_hours:
      name: Every N Hours (hourly)
      description: Hourly recurrence only — fire every this many hours.
      selector:
        number:
          min: 1
          max: 24
    minute_offset:
      name: Minute Offset (hourly)
      description: Hourly recurrence only — the minute past the hour it fires on.
      selector:
        number:
          min: 0
          max: 59
    hour_start:
      name: Active From Hour (hourly)
      description: Hourly recurrence only — first hour of the day it may fire (0-23, default 0).
      selector:
        number:
          min: 0
          max: 23
    hour_end:
      name: Active Until Hour (hourly)
      description: >
        Hourly recurrence only — last hour of the day it may fire (0-23,
        inclusive, default 23). Earlier than the start hour wraps past
        midnight.
      selector:
        number:
          min: 0
          max: 23
    webhook_slug:
      name: HA Webhook Slug (ha_webhook trigger)
      description: >
        ha_webhook trigger only — the slug the server listens on. Leave
        blank and the server makes one up.
      selector:
        text:
    theme:
      name: Theme Slug
      description: >
        Theme to push when the schedule fires. Any slug the dial's Theme
        select entity offers works here (open it to see your team's
        catalog). Leave blank to keep the current theme.
      example: "vesper"
      selector:
        text:
    menu_profile:
      name: Menu Profile Name
      description: Menu to switch to when the schedule fires.
      example: "Night Menu"
      selector:
        text:
    announcement_message:
      name: Announcement Message
      description: Text of the announcement shown when the schedule fires. Leave blank for none.
      selector:
        text:
    announcement_from:
      name: Announcement From
      description: Who the announcement is from.
      selector:
        text:
    announcement_duration_s:
      name: Announcement Duration (seconds)
      description: >
        How long the announcement stays up. 0 (the default) keeps it on the
        dial until someone touches it.
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    announcement_animation:
      name: Announcement Animation
      description: >
        Visual effect behind the announcement — the same choices as
        send_announcement's Animation.
      example: "sparkle"
      selector:
        select:
          options:
            - "none"
            - sparkle
            - flash
            - fireworks
            - magic_spell
            - fire
            - waves
            - rain
            - opening_flower
            - falling_leaves
            - confetti
            - snow
            - aurora
            - ripple
            - "signal:ready"
            - "signal:question"
            - "signal:available"
            - "signal:timed_state"
            - "signal:overdue"
            - "signal:comfort"
            - "signal:priority"
            - "signal:emergency"
            - "signal:dnd"
    target_scope:
      name: Target Scope (advanced)
      description: Omit for the addressed dial; "all" for team-wide.
      example: "all"
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn off to save the schedule without arming it.
      default: true
      selector:
        boolean:

enable_schedule:
  name: Enable Schedule
  description: Re-enable a named schedule paused with disable_schedule.
  fields:
    device_id:
      name: Device
      description: Dial(s) the schedule targets. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Schedule Name
      description: The name the schedule was created with.
      required: true
      selector:
        text:

disable_schedule:
  name: Disable Schedule
  description: Pause a named schedule without deleting it.
  fields:
    device_id:
      name: Device
      description: Dial(s) the schedule targets. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Schedule Name
      description: The name the schedule was created with.
      required: true
      selector:
        text:

fire_schedule:
  name: Fire Schedule Now
  description: Execute a named schedule immediately (test-fire).
  fields:
    device_id:
      name: Device
      description: Dial(s) the schedule targets. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    name:
      name: Schedule Name
      description: The name the schedule was created with.
      required: true
      selector:
        text:

push_menu:
  name: Push Menu
  description: >
    Switch the dial(s) to a different menu profile by name. Transient —
    the role-configured menu returns on the next auto-push (e.g. fresh
    boot). "Party mode menu for the evening."
  fields:
    device_id:
      name: Device
      description: Dial(s) to switch. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    profile:
      name: Menu Profile Name
      description: Name of the menu profile to show, as it appears in Helm or Console.
      required: true
      example: "Party"
      selector:
        text:

send_invitation:
  name: Send Invitation
  description: >
    Send a touch-and-hold consent prompt to a Deckhand dial. The dial
    queues internally (FIFO, cap 5) and waits to display until the
    clock face is idle — it never interrupts an in-progress
    interaction. The guest accepts by touching and holding the
    screen; declines by spinning the encoder. To run an automation on
    accept or decline, listen for a ``deckhand_dial_event`` with
    ``type: invitation_response`` and match on the ``invitation_id``
    you supplied here (auto-generated PER DIAL if omitted, returned
    in the log line).

    Quiet mode: set ``presentation: menu`` and the invitation appears
    as an item in the dial's menu instead of taking the screen —
    selecting the item accepts. Because the server injects the menu
    item, dials sharing a menu profile all see it, and the
    hold/decline/theme fields below do not apply. Quiet invitations
    ride the ``invitation_request`` plane — both Helm and Console
    implement it (deckhand-console#33), so this works on either
    backend.
  fields:
    device_id:
      name: Devices
      description: >
        The Deckhand dial(s) to invite. Pick several dials or a Room
        device to fan out — each dial gets its own generated
        invitation id unless you supply one explicitly. May be omitted
        when ``all_dials`` is on.
      required: false
      selector:
        device:
          integration: deckhand
          multiple: true
    all_dials:
      name: All dials
      description: >
        Send to every Deckhand dial this integration has discovered,
        across all teams. Combines with any explicit device selection.
      default: false
      selector:
        boolean:
    text:
      name: Prompt
      description: The question or invitation shown on the dial.
      required: true
      example: "Stewards: open the bar?"
      selector:
        text:
    presentation:
      name: Presentation
      description: >
        ``prompt`` (default) takes the screen with the touch-and-hold
        card. ``menu`` is the quiet path — the invitation becomes a
        selectable item in the dial's menu (selecting accepts), routed
        server-side so every dial sharing the menu profile sees it.
        Works on either Helm or Console.
      default: prompt
      selector:
        select:
          options:
            - prompt
            - menu
    menu_position:
      name: Menu position
      description: >
        Quiet (``menu``) presentation only — 1-based position for the
        invitation item in the menu. Omit to append at the end.
      required: false
      selector:
        number:
          min: 1
          max: 64
          mode: box
    subtitle:
      name: Subtitle
      description: Smaller line under the prompt. Optional.
      example: "Hold the screen to confirm"
      selector:
        text:
    invitation_id:
      name: Invitation ID
      description: >
        Optional id echoed back in the response event. If you want one
        automation to react to a specific invitation, set this so you
        can match in the trigger. When supplied it is used verbatim on
        EVERY targeted dial (one cancel retracts everywhere); when
        omitted each dial gets its own generated id.
      example: "invite-bar-open-1"
      selector:
        text:
    accept_label:
      name: Accept label
      description: Instruction under the perimeter ring during the hold.
      default: "Hold to accept"
      selector:
        text:
    decline_label:
      name: Decline label
      description: Instruction shown for the spin-to-decline gesture.
      default: "Spin to decline"
      selector:
        text:
    hold_seconds:
      name: Hold time
      description: How long the guest must touch-and-hold to accept.
      default: 5
      selector:
        number:
          min: 2
          max: 15
          unit_of_measurement: seconds
    ttl_s:
      name: TTL (seconds)
      description: >
        Wall-clock window before the invitation auto-expires. The dial
        emits an ``invitation_response`` with ``response: "expired"`` if
        no one resolves it in time.
      default: 600
      selector:
        number:
          min: 10
          max: 86400
          unit_of_measurement: seconds
    priority:
      name: Priority
      description: >
        ``urgent`` jumps ahead of normal-priority items in the queue.
        Use sparingly — the dial still waits for idle before displaying.
      default: normal
      selector:
        select:
          options:
            - normal
            - urgent
    theme_override:
      name: Theme override slug
      description: >
        Optional theme slug to render behind the prompt card. Any slug the
        dial's Theme select entity offers works here (open it to see your
        team's catalog). Falls back to the dial's current theme.
        ``solid_color`` is ignored when ``theme_override`` is set.
      example: "concierge"
      selector:
        text:
    solid_color:
      name: Solid background color
      description: >
        Background as a hex colour "#RRGGBB" (for example "#0A1F2C"). Used
        only when no theme_override is set.
      example: "#0A1F2C"
      selector:
        text:
    from_name:
      name: From
      description: Who the invitation is from. Optional.
      example: "Home Assistant"
      selector:
        text:
    transition:
      name: Arrival
      description: >
        How the prompt ARRIVES on screen. ``fade`` is the default and is
        the standard easing every invitation has always used. ``none``
        appears instantly. ``iris`` closes a circle over the screen and
        opens it on the prompt; ``dissolve`` does the same with a soft
        fade. Arrival only — ``cancel_invitation`` always returns
        quietly, whatever is set here, because a cancel is usually a
        correction or a timeout and making it theatrical draws attention
        to a mistake.
      default: "fade"
      selector:
        select:
          options:
            - "fade"
            - "none"
            - iris
            - dissolve
    on_accept:
      name: On-accept payload (advanced)
      description: >
        Optional opaque JSON object echoed by the dial when accepted.
        For pure-HA flows you can omit this — listen for the
        ``invitation_response`` event with ``response: "accepted"`` and
        branch in the automation. Provide this only when Helm (or
        another consumer of the response event) should route the
        action server-side. Shape:
        ``{ type: "fire_ha_service" | "push_theme" | ..., data: {...} }``.
        PRECEDENCE: if this is set, it wins outright and every
        ``on_*`` field below is ignored. Leave this empty to use the
        structured fields instead.
      selector:
        object:
    on_accept_type:
      name: On accept, then…
      description: >
        Structured alternative to ``on_accept`` above — pick what
        Helm/the dial should do when this invitation is accepted. Only
        used when ``on_accept`` is empty. "none" (default) records the
        answer and does nothing further.
      selector:
        select:
          options:
            - label: "Do nothing — just record the answer"
              value: "none"
            - label: "Change the dial's theme"
              value: "push_theme"
            - label: "Show a face"
              value: "push_face"
            - label: "Show a message"
              value: "push_message"
            - label: "Set the subtitle"
              value: "push_subtitle"
            - label: "Run a Home Assistant service"
              value: "fire_ha_service"
            - label: "Call a webhook"
              value: "webhook"
    on_theme_slug:
      name: On accept — theme slug
      description: Used when On Accept Type is "push_theme".
      example: "sunset-cove"
      selector:
        text:
    on_face_id:
      name: On accept — face ID
      description: >
        Used when On Accept Type is "push_face". The face's numeric id in
        Helm/Console, or its library uid. The face library syncs to Home
        Assistant: create_face / update_face return a face's uid, a
        dial's Showing sensor shows the uid of the face it wears (ref),
        and the integration's diagnostics list the library.
      selector:
        text:
    on_message_text:
      name: On accept — message text
      description: Used when On Accept Type is "push_message". Capped at 240 characters.
      selector:
        text:
    on_subtitle_text:
      name: On accept — subtitle text
      description: Used when On Accept Type is "push_subtitle". Capped at 120 characters.
      selector:
        text:
    on_ha_domain:
      name: On accept — HA service domain
      description: >
        Used when On Accept Type is "fire_ha_service". E.g. "light".
        May be left blank if On Accept HA Service is fully-qualified
        (e.g. "light.turn_on").
      example: "light"
      selector:
        text:
    on_ha_service:
      name: On accept — HA service
      description: >
        Used when On Accept Type is "fire_ha_service". E.g. "turn_on",
        or a fully-qualified "light.turn_on" (splits automatically
        when On Accept HA Service Domain is blank).
      example: "turn_on"
      selector:
        text:
    on_ha_entity:
      name: On accept — HA target entity
      description: Optional entity to target for the fired service.
      selector:
        entity:
    on_webhook_url:
      name: On accept — webhook URL
      description: Used when On Accept Type is "webhook". Full http(s) URL.
      selector:
        text:
          type: url

cancel_invitation:
  name: Cancel Invitation
  description: >
    Retract a pending or displayed invitation by id. If the dial was
    showing it, the dial emits an ``invitation_response`` with
    ``response: "cancelled"``. Covers both presentations: the direct
    face cancel handles prompt invitations, and a parallel publish on
    the Helm ``invitation_request`` plane retracts quiet (menu)
    invitations server-side.
  fields:
    device_id:
      name: Device
      description: The Deckhand dial that holds the invitation.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    invitation_id:
      name: Invitation ID
      description: The same id supplied to ``send_invitation``.
      required: true
      example: "invite-bar-open-1"
      selector:
        text:

# ── Face library (face sync plane) ──────────────────────────────────
# These write to the team's face library in Helm / Deckhand Console and
# wait (up to 10 s) for the server's answer, which they return as the
# service response. Faces are picked by uid or by exact name.

create_face:
  name: Create library face
  description: >
    Save a new face to the team's face library in Helm / Deckhand Console.
    It appears in the server's face library and every synced Home
    Assistant. Returns the server's answer, including the new face's uid
    and rev. Admin only. Needs a Helm / Console that syncs faces.
  fields:
    name:
      name: Name
      description: The face's name in the library (1–128 characters).
      required: true
      example: "Guest Temp"
      selector:
        text:
    kind:
      name: Kind
      description: >
        The kind of face, e.g. sensor (Readings), clock, message, image,
        blank, now_playing, charge, climate or perimeter_ring. The server
        lists the kinds it accepts on deckhand/<team>/faces/list; the
        integration's diagnostics show them too.
      required: true
      example: "sensor"
      selector:
        text:
    payload:
      name: Payload
      description: >
        The face's settings, as its editor saves them (at most 3600 bytes
        as compact JSON). Optional universal keys on hero faces: top_line,
        lines (up to 3), brightness (0–100), idle_return_s (0 or
        10–86400); a perimeter block adds the face's own ring.
      example: |
        entity_id: sensor.guest_room_temperature
        label: Guest room
      selector:
        object:
    description:
      name: Description
      description: Optional note shown in the library (at most 256 characters).
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the face is enabled in the library. Defaults to enabled.
      selector:
        boolean:
    config_entry_id:
      name: Deckhand team
      description: >
        Only needed with more than one Deckhand integration entry: the team
        whose library gets the face.
      selector:
        config_entry:
          integration: deckhand

update_face:
  name: Update library face
  description: >
    Change a face in the team's face library. Only the fields you set are
    changed; a payload replaces the whole payload. If someone else saved
    the face since your copy, the server refuses the update as stale and
    the error names the rev now in the library. Returns the server's
    answer with the new rev. Admin only. System faces are read-only.
  fields:
    face:
      name: Face
      description: The face to change — its uid, or its exact name in the library.
      required: true
      example: "Guest Temp"
      selector:
        text:
    base_rev:
      name: Base revision
      description: >
        The rev you edited. Leave empty to use the rev Home Assistant last
        saw in the library; set it to the rev a stale error named to
        overwrite a newer save.
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    name:
      name: Name
      description: New name (1–128 characters).
      selector:
        text:
    kind:
      name: Kind
      description: New kind. The payload is re-checked against it.
      selector:
        text:
    payload:
      name: Payload
      description: New payload. Replaces the whole stored payload; it is never merged.
      selector:
        object:
    description:
      name: Description
      description: New description (at most 256 characters).
      selector:
        text:
    enabled:
      name: Enabled
      description: Enable or disable the face in the library.
      selector:
        boolean:
    config_entry_id:
      name: Deckhand team
      description: Only needed when more than one Deckhand team holds a face of this name or uid.
      selector:
        config_entry:
          integration: deckhand

delete_face:
  name: Delete library face
  description: >
    Delete a face from the team's face library. Refused when the face is
    still in use (a schedule, menu, invitation or Composer item uses it),
    when it changed since the rev you name, and for system faces. Admin
    only.
  fields:
    face:
      name: Face
      description: The face to delete — its uid, or its exact name in the library.
      required: true
      example: "Guest Temp"
      selector:
        text:
    base_rev:
      name: Base revision
      description: The rev you mean to delete. Leave empty to use the rev Home Assistant last saw.
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    config_entry_id:
      name: Deckhand team
      description: Only needed when more than one Deckhand team holds a face of this name or uid.
      selector:
        config_entry:
          integration: deckhand

mount_library_face:
  name: Mount library face
  description: >
    Put a saved library face on dials through Helm / Deckhand Console, the
    same way their editors do: its config, sensor labels and own ring come
    with it, it replaces the dial's current hero face, and the dial's
    Showing sensor names it. Returns each dial's outcome (sent,
    unknown_dial, refused). Admin only.
  fields:
    device_id:
      name: Device
      description: Dial(s) to mount the face on. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    face:
      name: Face
      description: The library face — its uid, or its exact name.
      required: true
      example: "Guest Temp"
      selector:
        text:
    overrides:
      name: Overrides
      description: Optional payload keys to change for this mount only. The saved face is untouched.
      selector:
        object:

test_face:
  name: Test face on dial
  description: >
    Preview a face on dials for a while without saving anything: either a
    library face, or an unsaved one given by kind and payload. Not
    retained, and the dial's own face comes back by itself after ttl_s
    (or with Clear face test). Returns the test_id to clear it with.
    Admin only.
  fields:
    device_id:
      name: Device
      description: Dial(s) to preview on. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    face:
      name: Face
      description: A library face to preview — its uid or exact name. Leave empty to preview an unsaved face (kind + payload).
      example: "Guest Temp"
      selector:
        text:
    kind:
      name: Kind
      description: The kind of the unsaved face to preview (when Face is empty).
      example: "message"
      selector:
        text:
    payload:
      name: Payload
      description: The unsaved face's payload (when Face is empty).
      selector:
        object:
    overrides:
      name: Overrides
      description: Payload keys to change for this preview of a library face.
      selector:
        object:
    ttl_s:
      name: Duration
      description: Seconds before the dial's own face comes back (30–900, default 300).
      default: 300
      selector:
        number:
          min: 30
          max: 900
          unit_of_measurement: s
    test_id:
      name: Test ID
      description: Optional id for this test, to clear it by later. One is made up when empty.
      selector:
        text:

clear_face_test:
  name: Clear face test
  description: >
    End a face preview now and put back the face the dial was showing.
    Admin only.
  fields:
    device_id:
      name: Device
      description: Dial(s) to clear the preview on.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    test_id:
      name: Test ID
      description: The test_id Test face on dial returned.
      selector:
        text:
    kind:
      name: Kind
      description: >
        The kind of face under test. Only needed without a test_id this
        Home Assistant started (for example after a restart).
      selector:
        text:

mount_climate_face:
  name: Mount Climate face
  description: >
    Turn the dial into a thermostat for one climate entity: twist to set
    the temperature, and pick a mode when you list some. A change made on
    the dial goes to Helm / Deckhand Console as a request for that entity
    — the face never switches the HVAC itself. Opens on the entity's
    current setpoint, temperature and mode. Retained, so it survives a
    reboot; unmount_face with face_id climate takes it down. Firmware
    0.4.98 or later (older dials ignore it, and Repairs says so). Admin
    only.
  fields:
    device_id:
      name: Device
      description: Dial(s) to mount the face on. Multiple, Rooms, or "all" (YAML mode) supported.
      required: true
      selector:
        device:
          integration: deckhand
          multiple: true
    entity_id:
      name: Thermostat
      description: The climate entity the face controls.
      required: true
      example: "climate.living_room"
      selector:
        entity:
          domain: climate
    title:
      name: Title
      description: Shown at the top of the face, up to 22 characters. Default "Climate".
      example: "Living Room"
      selector:
        text:
    min:
      name: Minimum
      description: >
        Lowest setpoint the dial offers (0-200, below Maximum). Default 60.
        The dial draws the numbers as °F whatever your unit system, so pick
        a range in the entity's own units.
      default: 60
      selector:
        number:
          min: 0
          max: 200
          step: 1
          mode: box
    max:
      name: Maximum
      description: Highest setpoint the dial offers (0-200, above Minimum). Default 85.
      default: 85
      selector:
        number:
          min: 0
          max: 200
          step: 1
          mode: box
    step:
      name: Step
      description: How far one click of the knob moves the setpoint (1-10). Default 1.
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    hvac_modes:
      name: Modes
      description: >
        Up to 6 modes the dial's mode picker offers. Leave empty for no
        picker.
      selector:
        select:
          multiple: true
          options:
            - "off"
            - heat
            - cool
            - heat_cool
            - auto
            - dry
            - fan_only
